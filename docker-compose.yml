services:
  mysql:
    image: mysql:8.4
    container_name: travel-memory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - travel-memory
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./travel-memory-server
    container_name: travel-memory-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      APP_UPLOAD_DIR: /app/uploads
      APP_UPLOAD_CLEANUP_ENABLED: ${APP_UPLOAD_CLEANUP_ENABLED:-false}
      APP_UPLOAD_CLEANUP_DRY_RUN: ${APP_UPLOAD_CLEANUP_DRY_RUN:-true}
      APP_UPLOAD_CLEANUP_RETENTION_HOURS: ${APP_UPLOAD_CLEANUP_RETENTION_HOURS:-24}
      APP_UPLOAD_CLEANUP_CRON: ${APP_UPLOAD_CLEANUP_CRON:-0 30 3 * * ?}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY}
      AMAP_REVERSE_GEOCODE_ENABLED: ${AMAP_REVERSE_GEOCODE_ENABLED:-false}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-false}
      APP_REGISTRATION_ENABLED: ${APP_REGISTRATION_ENABLED:-false}
      APP_REGISTRATION_INVITE_CODE: ${APP_REGISTRATION_INVITE_CODE:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
    networks:
      - travel-memory

  frontend:
    build:
      context: ./travel-memory-web
      args:
        VITE_AMAP_JS_API_KEY: ${VITE_AMAP_JS_API_KEY:-}
        VITE_AMAP_SECURITY_JS_CODE: ${VITE_AMAP_SECURITY_JS_CODE:-}
        VITE_AMAP_SERVICE_HOST: ${VITE_AMAP_SERVICE_HOST:-}
    container_name: travel-memory-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - travel-memory

volumes:
  mysql_data:

networks:
  travel-memory:
    driver: bridge
