server:
  port: 8080
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: travel-memory-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travel_memory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:travel_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
mybatis-plus:
  type-aliases-package: com.travelmemory.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:false}
    invite-code: ${APP_REGISTRATION_INVITE_CODE:}
  upload:
    dir: ${APP_UPLOAD_DIR:../uploads}
    cleanup:
      enabled: ${APP_UPLOAD_CLEANUP_ENABLED:false}
      dry-run: ${APP_UPLOAD_CLEANUP_DRY_RUN:true}
      retention-hours: ${APP_UPLOAD_CLEANUP_RETENTION_HOURS:24}
      cron: ${APP_UPLOAD_CLEANUP_CRON:0 30 3 * * ?}

amap:
  web-service:
    key: ${AMAP_WEB_SERVICE_KEY:}
  reverse-geocode:
    enabled: ${AMAP_REVERSE_GEOCODE_ENABLED:false}
